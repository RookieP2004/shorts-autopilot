name: stats
# Pulls channel + per-video stats into data/stats/latest.json (daily, or on demand).
on:
  schedule:
    - cron: "40 20 * * *"   # 02:10 IST
  workflow_dispatch:

concurrency:
  group: stats
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q google-api-python-client google-auth google-auth-oauthlib
      - name: Pull stats
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m autopilot stats
      - name: Commit
        run: |
          git config user.name "shorts-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add data/stats
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "stats $(date -u +%F) [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 5; done
